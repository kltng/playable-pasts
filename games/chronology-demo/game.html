<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mill Fire — a chronology warm-up</title>
</head>
<body>

<!-- ==================================================================
     GAME_DATA — everything a teacher might want to change is here.
     Edit the text between the quotation marks. Do not remove the commas
     or the brackets. Save the file and reopen it to see your changes.

     In an ordering round, list the documents in their CORRECT order and
     the game shuffles them for the player. Each "clue" explains what in
     the document fixes its place.

     Every document below is INVENTED for this demonstration. None of it
     is a historical source. See the Sources & assumptions screen.
     ================================================================== -->
<script>
const GAME_DATA = {
  title: "The Mill Fire",
  subtitle: "A chronology and causation warm-up",
  minutes: 15,
  intro: "A water mill burned down. The papers that survive about it carry no year and were filed in no order.\n\nFirst put them in the order they were written, using only what they say. Then decide what, if anything, they let you say about why the mill burned.",

  rounds: [
    {
      type: "order",
      question: "Put these four papers in the order they were written.",
      help: "None of them is dated. Read for what each one takes for granted, and what it does not yet know.",
      docs: [
        { id: "A", label: "Carpenter's bill",
          kind: "Invoice, addressed to the mill",
          text: "For a new wheel, hung at the mill this spring as the widow ordered after her husband's death: six pounds, not yet paid. The bearing must be greased each week, else it will run hot. Whoever takes the mill should be told.",
          clue: "The carpenter is still waiting to be paid, and nobody yet knows who will take the mill ('whoever takes the mill'). The lease names the tenant and says the carpenter has been paid, so the bill comes first." },
        { id: "B", label: "Lease of the mill",
          kind: "Legal agreement between the widow and a new tenant",
          text: "The widow lets the mill to Thomas the miller, with the wheel newly hung this spring and the carpenter paid for it, for seven years. Thomas shall keep the sluice full and the wheel greased.",
          clue: "The carpenter has been paid, so this comes after his bill. Thomas is only now becoming the tenant, and nothing has burned." },
        { id: "C", label: "Letter from the miller's wife to her sister",
          kind: "Private letter",
          text: "The fire took the roof and half the wheel in the night. It started at the wheel-side wall. The neighbours press us to ask the parish for help, but Thomas will not ask yet.",
          clue: "The fire has happened, so this is after the lease. But the family has not yet asked the parish, so it comes before the parish decides to help them." },
        { id: "D", label: "Parish meeting minutes",
          kind: "Administrative record",
          text: "Agreed: a collection for Thomas the miller and his family, burned out. Some say he was drunk and careless with his lamp. He denies it.",
          clue: "The parish is now acting on a request the letter says had not yet been made. Last." }
      ],
      why: "The bill is still unpaid and does not know who the tenant will be; the lease names the tenant and says the carpenter is paid; the letter reports the fire but says the parish has not been asked; the minutes record the parish helping. No paper carries a date, but each one takes for granted something another one describes happening. That chain is the whole method."
    },
    {
      type: "order",
      question: "Three more papers. Put them in the order they were written, not the order of what they describe.",
      help: "One of these describes the earliest event but was written last. Watch for it.",
      docs: [
        { id: "E", label: "Petition from Thomas to the lord of the manor",
          kind: "Formal request",
          text: "Your tenant Thomas begs timber from the wood to rebuild the mill roof, the fire having left him half a wheel and no roof over it.",
          clue: "The mill is burned and not yet rebuilt. This is asking for the timber." },
        { id: "F", label: "The lord's rent roll",
          kind: "Internal financial record",
          text: "The mill, rebuilt and let again to Thomas: rent as before, with two years forgiven for his loss.",
          clue: "The mill is rebuilt, so the timber has been given and used. After the petition." },
        { id: "G", label: "Town chronicle",
          kind: "Narrative account, compiled long afterwards",
          text: "In those years the mill burned, they say through the miller's drunkenness, and was a great loss to the town. It was set down here from the memory of old men.",
          clue: "It describes the fire, the earliest event. But it was written 'from the memory of old men', long after the mill was already rebuilt. The date of writing and the date of what is described are different things." }
      ],
      why: "The chronicle is the trap. It talks about the fire, so it feels early, but it was written last, from memory, once the story had hardened into 'the miller's drunkenness'. The order of writing is what tells you which documents could have influenced which. The chronicle could not have influenced the petition; the parish gossip could have influenced the chronicle."
    },
    {
      type: "choose",
      question: "Now that the papers are in order: why did the mill burn?",
      help: "Read the papers again, in sequence, and ask what each one can and cannot carry.",
      docs: [
        { id: "A", label: "Carpenter's bill", kind: "Invoice, earliest paper",
          text: "The bearing must be greased each week, else it will run hot." },
        { id: "C", label: "The miller's wife", kind: "Private letter, days after the fire",
          text: "It started at the wheel-side wall, in the night." },
        { id: "D", label: "Parish minutes", kind: "Weeks after the fire",
          text: "Some say he was drunk and careless with his lamp. He denies it." },
        { id: "G", label: "Town chronicle", kind: "Decades after the fire",
          text: "They say through the miller's drunkenness." }
      ],
      options: [
        { text: "The miller was drunk and knocked over his lamp. Two documents say so.",
          correct: false,
          why: "Two documents repeat it; neither witnessed it. The minutes say 'some say', which is the parish recording a rumour, not a finding. The chronicle was written decades later from memory, in a town where that rumour had been circulating since the minutes. Put in order, the chronicle is downstream of the gossip, not independent of it. That is one claim, not two." },
        { text: "The evidence points to the wheel running hot, but that is an inference from three papers, not something any of them says.",
          correct: true,
          why: "The carpenter warned that the bearing would run hot without grease. The lease made greasing the tenant's duty. The wife, the only person writing from inside the mill within days, says the fire started at the wheel-side wall, which is where the bearing is. That fits a hot bearing. It does not rule out a lamp, but no paper written close to the fire puts a lamp at that wall. None of these was written to explain the fire, which is exactly why they are worth more than the two that were. It is still an inference. State it as one." },
        { text: "Nothing here can tell us the cause. Every account is second-hand or interested.",
          correct: false,
          why: "This is the over-correction. It is true that no paper states the cause and that the parish and chronicle are repeating hearsay. But the carpenter, the lease, and the letter were written for other purposes, by different people, at different times, and they fit a single mechanism. Historians do not need a confession to argue a probable cause. They need independent pieces that fit, and they need to say 'probably'." }
      ]
    }
  ],

  endings: {
    high: { title: "You read the archive in order",
      text: "You let the papers date each other, kept the date of writing apart from the date of the event, and argued a cause without pretending to a certainty the evidence does not have." },
    mid: { title: "Most of the chain held",
      text: "Look back at where the order broke. Usually it is one paper that describes an early event but was written late, or one that everyone treats as evidence when it is only repeating what others said." },
    low: { title: "The story arrived before the evidence",
      text: "The chronicle's version is the easiest to remember and the last to be written. Play again, and this time refuse to believe any paper knows anything it could not yet have known." }
  },

  debrief: [
    "None of these papers carried a date. What did you actually use to order them, and could the same trick be played on you by a forger?",
    "The chronicle describes the earliest event and was written last. Where else have you met a source like that, and did you notice at the time?",
    "The parish minutes record 'some say'. Is that evidence of the fire's cause, evidence of what the parish believed, or both? Does it matter which?",
    "Round three rewarded an answer that said 'probably'. When is 'the evidence cannot settle it' the honest answer, and when is it a way of avoiding an argument?",
    "This mill burned with nobody hurt. How would your reading change if the miller's family had died in the fire and the rumour of drunkenness had survived?"
  ],

  sources: {
    statement: "Every paper in this game is invented. There is no mill, no Thomas, no widow, and no town chronicle. Nothing here is a historical source and nothing should be cited.",
    reason: "The exercise teaches two habits: dating undated documents from what they take for granted, and separating the date a document was written from the date of what it describes. Real archives supply both problems, but rarely in fifteen minutes and never without period knowledge students may not have yet. The documents were written to carry those problems and nothing else.",
    rows: [
      ["Every document, name, sum, and event", "Fictional connective tissue", "Invented for this demonstration. Not evidence of anything."],
      ["Ordering undated documents from internal cross-references", "Corroborated interpretation", "Standard practice in diplomatic and archival work. Stated as a method, not a finding about any real archive."],
      ["Date of composition is distinct from date of the events described", "Corroborated interpretation", "Basic source criticism. The chronicle in round two exists to make the distinction bite."],
      ["Later narrative accounts can be downstream of earlier gossip", "Corroborated interpretation", "A common pattern in the transmission of local memory. Stated as a tendency, not a law."],
      ["A probable cause can be argued from independent documents that fit a mechanism", "Modeling assumption", "The game rewards a hedged inference over both a rumour and a refusal to infer. Real historians argue about where that line sits."],
      ["Scoring", "Modeling assumption", "Turning chronology and causation into right and wrong answers is a simplification the game makes so it can be played in fifteen minutes. Real source work is argued, not marked."]
    ]
  },

  teacherNote: "Built as a demonstration of the Playable Past format, and as a companion to The Grain Shipment, which ends in 'the evidence cannot settle it'. This one ends in 'probably', so the two played together make the point that neither answer is always right. Replace round one with four undated documents from your own unit; the ordering mechanic carries over unchanged."
};
</script>

<style>

    --paper: #f5f3ee;
    --card: #fffefa;
    --ink: #1d1b17;
    --soft: #585245;
    --faint: #6b6555;
    --rule: #dcd6c7;
    --accent: #375c73;
    --accent-soft: #e4ecf1;
    --good: #2d6146;
    --good-soft: #e6f1ea;
    --bad: #9a3b2c;
    --bad-soft: #fbeae6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14161a; --card: #1c1f24; --ink: #e8e6df; --soft: #aeaa9e;
      --faint: #9a9682; --rule: #33373e; --accent: #8fb6cf; --accent-soft: #1f2b34;
      --good: #87c9a3; --good-soft: #1b2a21; --bad: #ef9483; --bad-soft: #33201c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 20px 4rem;
  }
  .sheet { max-width: 44rem; margin: 0 auto; }
  header.top { padding: 2rem 0 1.2rem; border-bottom: 1px solid var(--rule); margin-bottom: 2rem; }
  h1 { font: 600 clamp(1.7rem, 5vw, 2.4rem)/1.15 "Iowan Old Style", Palatino, Georgia, serif; margin: 0 0 0.3rem; }
  .subtitle { color: var(--soft); margin: 0; }
  h2 { font: 600 1.4rem/1.25 "Iowan Old Style", Palatino, Georgia, serif; margin: 0 0 0.8rem; }
  h3 { font-size: 1.02rem; margin: 0 0 0.2rem; }
  p { margin: 0 0 1rem; }
  .help { color: var(--soft); }
  .progress {
    display: flex; gap: 6px; align-items: center;
    font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 1.4rem;
  }
  .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); display: inline-block; }
  .pip.done { background: var(--accent); }

  ol.cards { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .doc {

  }
  .doc + .doc { margin-top: 12px; }
  .doc .kind { font-size: 0.8rem; color: var(--faint); margin: 0 0 0.5rem; }

  .doc .tag {
    font: 600 0.72rem/1 system-ui, sans-serif;
    background: var(--accent-soft); color: var(--accent);
    padding: 3px 6px; border-radius: 3px; margin-right: 6px;
  }
  .doc .slot { font: 600 0.78rem/1 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin: 0 0 0.4rem; }
  .doc .move { display: flex; gap: 8px; margin-top: 0.8rem; flex-wrap: wrap; }
  .doc.right { border-left-color: var(--good); }
  .doc.wrong { border-left-color: var(--bad); }
  .doc .clue { margin: 0.8rem 0 0; padding-top: 0.6rem; border-top: 1px dashed var(--rule); font-size: 0.95rem; }
  .doc .clue strong { display: block; font: 600 0.78rem/1 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.3rem; }
  .doc.right .clue strong { color: var(--good); }
  .doc.wrong .clue strong { color: var(--bad); }
  .options { list-style: none; padding: 0; margin: 1.4rem 0 0; display: grid; gap: 10px; }
  .options button {
    width: 100%; text-align: left;
    font-family: inherit; font-size: 1rem; font-weight: 400; line-height: 1.45;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px;

  }
  .options button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .options button:disabled { cursor: default; opacity: 1; }

  .options button.chosen.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .options button.reveal { border-color: var(--good); }
  .verdict { margin-top: 1.4rem; padding: 16px 18px; border-radius: 4px; border: 1px solid var(--rule); background: var(--card); }
  .verdict.right { border-color: var(--good); background: var(--good-soft); }
  .verdict.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .verdict .label { font: 600 0.78rem/1 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 0.5rem; }
  .verdict.right .label { color: var(--good); }

  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }

  .btn.small { font-size: 1rem; padding: 8px 12px; }

  :where(button, a, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2[tabindex]:focus { outline: none; }
  h2[tabindex]:focus-visible { outline: 2px dotted var(--accent); outline-offset: 4px; }
  ol.debrief { padding-left: 1.3rem; }
  ol.debrief li { margin-bottom: 0.7rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.93rem; margin-top: 1rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  .notice { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 14px 16px; border-radius: 0 3px 3px 0; margin-bottom: 1.4rem; }
  .notice p:last-child { margin-bottom: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  footer.bottom {
    margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--rule);
    font-size: 0.85rem; color: var(--faint);
    display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
  }
  footer.bottom button { font-family: inherit; font-size: 1rem; font-weight: 400; line-height: 1.2; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .verdict, .doc { transition: border-color 0.15s ease, background-color 0.15s ease; }
  }
</style>

<div class="sheet">
  <header class="top">
    <h1 id="game-title">The Mill Fire</h1>
    <p class="subtitle" id="game-subtitle">A chronology and causation warm-up</p>
  </header>

  <main id="stage"></main>
  <p id="announce" class="visually-hidden" aria-live="polite"></p>

  <footer class="bottom">
    <span>A Playable Pasts demonstration.</span>
    <button type="button" id="to-sources">Sources &amp; assumptions</button>
    <button type="button" id="to-restart">Restart from the beginning</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  const D = GAME_DATA;
  const stage = document.getElementById("stage");
  const announce = document.getElementById("announce");
  let round = 0;
  let score = 0;
  let order = [];       // for ordering rounds: indexes into r.docs, in the player's current order
  let answered = false;
  let savedScreen = null;   // the screen the student left to read Sources & assumptions
  let onSources = false;

  document.title = D.title + " — " + D.subtitle;
  document.getElementById("game-title").textContent = D.title;
  document.getElementById("game-subtitle").textContent = D.subtitle;

  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === "class") node.className = props[k];
        else if (k === "text") node.textContent = props[k];
        else node.setAttribute(k, props[k]);
      });
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function paragraphs(text) {
    return text.split("\n\n").map(function (p) { return el("p", { text: p }); });
  }

  function say(text) { announce.textContent = ""; announce.textContent = text; }

  /** A shuffle that is never accidentally the right order. */
  function shuffled(n) {
    const a = [];
    for (let i = 0; i < n; i++) a.push(i);
    let tries = 0;
    do {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      tries += 1;
    } while (tries < 20 && a.every(function (v, i) { return v === i; }));
    if (a.every(function (v, i) { return v === i; })) a.reverse();
    return a;
  }

  function progress() {
    const wrap = el("p", { class: "progress" });
    wrap.appendChild(document.createTextNode("Round " + (round + 1) + " of " + D.rounds.length));
    D.rounds.forEach(function (_, i) {
      const cls = i < round ? "pip done" : i === round ? "pip now" : "pip";
      wrap.appendChild(el("span", { class: cls, "aria-hidden": "true" }));
    });
    return wrap;
  }

  function docCard(doc, extraChildren, cls) {
    return el("div", { class: "doc" + (cls ? " " + cls : "") }, [
      el("h3", {}, [el("span", { class: "tag", text: doc.id }), document.createTextNode(" " + doc.label)]),
      el("p", { class: "kind", text: doc.kind }),
      el("blockquote", { text: "“" + doc.text + "”" })
    ].concat(extraChildren || []));
  }

  let firstPaint = true;

  /**
   * Move focus to the top of the new screen. Without this a keyboard or screen
   * reader user is dropped back at the document start after every choice.
   * Skipped on first load so the page is announced from its heading.
   */
  function focusScreen(node) {
    if (firstPaint) { firstPaint = false; return; }
    node.setAttribute("tabindex", "-1");
    node.focus();
  }

  /* ---------------- screens ---------------- */

  function showIntro() {
    onSources = false;
    savedScreen = null;
    stage.replaceChildren();
    stage.appendChild(el("div", { class: "notice" }, [
      el("p", { text: "Every paper in this game is invented. It is a method exercise, not a history lesson about a real mill." })
    ]));
    paragraphs(D.intro).forEach(function (p) { stage.appendChild(p); });
    const start = el("button", { class: "btn", type: "button", text: "Open the papers" });
    start.addEventListener("click", function () { round = 0; score = 0; showRound(); });
    stage.appendChild(el("div", { class: "row" }, [start]));
    focusScreen(stage.firstElementChild);
  }

  function showRound() {
    answered = false;
    const r = D.rounds[round];
    if (r.type === "order") order = shuffled(r.docs.length);
    stage.replaceChildren();
    stage.appendChild(progress());
    const heading = el("h2", { text: r.question });
    stage.appendChild(heading);
    if (r.help) stage.appendChild(el("p", { class: "help", text: r.help }));

    if (r.type === "order") renderOrdering(r, null);
    else renderChoice(r);
    focusScreen(heading);
  }

  /* ---- ordering rounds ---- */

  function renderOrdering(r, focusSpec) {
    const old = document.getElementById("order-area");
    if (old) old.remove();
    const area = el("div", { id: "order-area" });
    const list = el("ol", { class: "cards", "aria-label": "Your order, earliest first" });

    order.forEach(function (docIndex, pos) {
      const doc = r.docs[docIndex];
      const up = el("button", { class: "btn ghost small", type: "button", text: "Move up", "aria-label": "Move " + doc.label + " up" });
      const down = el("button", { class: "btn ghost small", type: "button", text: "Move down", "aria-label": "Move " + doc.label + " down" });
      if (pos === 0) up.disabled = true;
      if (pos === order.length - 1) down.disabled = true;
      up.addEventListener("click", function () { move(pos, -1, r); });
      down.addEventListener("click", function () { move(pos, 1, r); });
      const card = docCard(doc, [el("div", { class: "move" }, [up, down])]);
      card.insertBefore(el("p", { class: "slot", text: "Position " + (pos + 1) }), card.firstChild);
      list.appendChild(el("li", {}, [card]));
    });
    area.appendChild(list);

    const check = el("button", { class: "btn", type: "button", text: "Check my order" });
    check.addEventListener("click", function () { judgeOrder(r); });
    area.appendChild(el("div", { class: "row" }, [check]));
    stage.appendChild(area);

    if (focusSpec) {
      const buttons = list.querySelectorAll("li")[focusSpec.pos].querySelectorAll("button");
      const target = focusSpec.dir < 0 ? buttons[0] : buttons[1];
      (target.disabled ? (focusSpec.dir < 0 ? buttons[1] : buttons[0]) : target).focus();
    }
  }

  function move(pos, dir, r) {
    if (answered) return;
    const to = pos + dir;
    if (to < 0 || to >= order.length) return;
    const t = order[pos]; order[pos] = order[to]; order[to] = t;
    renderOrdering(r, { pos: to, dir: dir });
    say(r.docs[order[to]].label + " is now in position " + (to + 1) + " of " + order.length + ".");
  }

  function judgeOrder(r) {
    if (answered) return;
    answered = true;
    const allRight = order.every(function (v, i) { return v === i; });
    if (allRight) score += 1;

    const old = document.getElementById("order-area");
    if (old) old.remove();
    const area = el("div", { id: "order-area" });
    const list = el("ol", { class: "cards", "aria-label": "Your order, marked" });
    let rightCount = 0;
    order.forEach(function (docIndex, pos) {
      const doc = r.docs[docIndex];
      const right = docIndex === pos;
      if (right) rightCount += 1;
      const clue = el("p", { class: "clue" }, [
        el("strong", { text: right ? "Right place" : "Belongs at position " + (docIndex + 1) }),
        document.createTextNode(doc.clue)
      ]);
      const card = docCard(doc, [clue], right ? "right" : "wrong");
      card.insertBefore(el("p", { class: "slot", text: "You put it at position " + (pos + 1) }), card.firstChild);
      list.appendChild(el("li", {}, [card]));
    });
    area.appendChild(list);

    const verdict = el("div", { class: "verdict " + (allRight ? "right" : "wrong") }, [
      el("span", { class: "label", text: allRight ? "Well judged" : rightCount + " of " + order.length + " in the right place" }),
      el("p", { text: r.why })
    ]);
    area.appendChild(verdict);
    area.appendChild(el("div", { class: "row" }, [nextButton()]));
    stage.appendChild(area);
    verdict.setAttribute("tabindex", "-1");
    verdict.focus();
  }

  /* ---- choice rounds ---- */

  function renderChoice(r) {
    r.docs.forEach(function (doc) { stage.appendChild(docCard(doc)); });
    const list = el("ul", { class: "options" });
    r.options.forEach(function (opt, i) {
      const btn = el("button", { type: "button", text: opt.text });
      btn.addEventListener("click", function () { choose(i, list, r); });
      list.appendChild(el("li", {}, [btn]));
    });
    stage.appendChild(list);
  }

  function choose(index, list, r) {
    if (answered) return;
    answered = true;
    const opt = r.options[index];
    if (opt.correct) score += 1;

    list.querySelectorAll("button").forEach(function (btn, i) {
      btn.disabled = true;
      if (i === index) btn.className = "chosen " + (opt.correct ? "right" : "wrong");
      else if (r.options[i].correct) btn.className = "reveal";
    });

    const verdict = el("div", { class: "verdict " + (opt.correct ? "right" : "wrong") }, [
      el("span", { class: "label", text: opt.correct ? "Well judged" : "Not quite" }),
      el("p", { text: opt.why })
    ]);
    stage.appendChild(verdict);
    const next = nextButton();
    stage.appendChild(el("div", { class: "row" }, [next]));
    next.focus();
  }

  function nextButton() {
    const last = round === D.rounds.length - 1;
    const next = el("button", { class: "btn", type: "button", text: last ? "See where you stand" : "Next round" });
    next.addEventListener("click", function () {
      if (last) showEnding();
      else { round += 1; showRound(); }
    });
    return next;
  }

  function showEnding() {
    const ending = score >= 3 ? D.endings.high : score >= 2 ? D.endings.mid : D.endings.low;
    stage.replaceChildren();
    const heading = el("h2", { text: ending.title });
    stage.appendChild(heading);
    stage.appendChild(el("p", { text: "You got " + score + " of " + D.rounds.length + " rounds the way the evidence supports." }));
    stage.appendChild(el("p", { text: ending.text }));

    stage.appendChild(el("h2", { text: "Questions for the discussion" }));
    stage.appendChild(el("p", { text: "The argument after the game is the part that matters. These are the questions the game was built to raise." }));
    const ol = el("ol", { class: "debrief" });
    D.debrief.forEach(function (q) { ol.appendChild(el("li", { text: q })); });
    stage.appendChild(ol);

    const again = el("button", { class: "btn", type: "button", text: "Play again" });
    again.addEventListener("click", showIntro);
    const sources = el("button", { class: "btn ghost", type: "button", text: "Sources & assumptions" });
    sources.addEventListener("click", showSources);
    stage.appendChild(el("div", { class: "row" }, [again, sources]));
    focusScreen(heading);
  }

  function showSources() {
    // Keep the screen the student was on, with its state, so "Back to the game"
    // returns there instead of restarting. Opening Sources twice keeps the first one.
    if (!onSources) savedScreen = Array.from(stage.childNodes);
    onSources = true;
    stage.replaceChildren();
    const heading = el("h2", { text: "Sources & assumptions" });
    stage.appendChild(heading);
    stage.appendChild(el("div", { class: "notice" }, [el("p", { text: D.sources.statement })]));
    stage.appendChild(el("p", { text: D.sources.reason }));

    const table = el("table");
    table.appendChild(el("thead", {}, [el("tr", {}, [
      el("th", { text: "Element" }), el("th", { text: "Status" }), el("th", { text: "Note" })
    ])]));
    const body = el("tbody");
    D.sources.rows.forEach(function (row) {
      body.appendChild(el("tr", {}, row.map(function (cell) { return el("td", { text: cell }); })));
    });
    table.appendChild(body);
    stage.appendChild(table);

    stage.appendChild(el("h2", { text: "For the instructor" }));
    stage.appendChild(el("p", { text: D.teacherNote }));

    const back = el("button", { class: "btn", type: "button", text: "Back to the game" });
    back.addEventListener("click", backToGame);
    stage.appendChild(el("div", { class: "row" }, [back]));
    focusScreen(heading);
  }

  function backToGame() {
    const saved = savedScreen;
    onSources = false;
    savedScreen = null;
    if (!saved || !saved.length) { showIntro(); return; }
    stage.replaceChildren.apply(stage, saved);
    focusScreen(stage.querySelector("h2") || stage.firstElementChild);
  }

  document.getElementById("to-sources").addEventListener("click", showSources);
  document.getElementById("to-restart").addEventListener("click", showIntro);

  showIntro();
}());
</script>

</body>
</html>
